<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Boekhouding{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="topbar__brand">Boekhouding</span>
    <nav class="topbar__nav">
      {% if request.session.get("user_id") %}
        <a href="/">Dashboard</a>
        <a href="/accounts">Rekeningen</a>
        <a href="/upload">Upload</a>
        <a href="/review">Controle</a>
        <span class="muted">{{ request.session.get("user_name") }}</span>
        <form method="post" action="/logout" class="inline-form">
          <button type="submit" class="link-button">Uitloggen</button>
        </form>
      {% else %}
        <a href="/login">Inloggen</a>
      {% endif %}
    </nav>
  </header>
  <main class="content {% block content_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
